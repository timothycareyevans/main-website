<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Humanoid Animation Gallery</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e4e4; font-family: system-ui, sans-serif; }
  #ui { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; display: flex; flex-wrap: wrap; gap: 8px; max-width: 92vw; z-index: 2; }
  #ui button { padding: 8px 14px; border: 2px solid #111; border-radius: 8px; background: #fff; color: #111; font-size: 14px; cursor: pointer; }
  #ui button.active { background: #111; color: #fff; }
  #hint { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 12px; color: #222; font-size: 12px; z-index: 2; }
  #dial { position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 2; background: #fff; color: #111; border: 2px solid #111; border-radius: 10px; padding: 8px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  #dial input { width: 200px; accent-color: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="hint">Pick an animation. In Free Walk, use WASD or the arrow keys.</div>
<div id="dial"><label for="cam">Camera view: <span id="deg">0°</span></label><input id="cam" type="range" min="0" max="360" step="1" value="0"><label for="tilt">Camera tilt: <span id="tiltdeg">66°</span></label><input id="tilt" type="range" min="10" max="85" step="1" value="66"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe4e4e4);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 0.9));
  var sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(6, 12, 4);
  sun.castShadow = true;
  scene.add(sun);

  var ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0xc4c4c4, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  var grid = new THREE.GridHelper(60, 60, 0x555555, 0x888888);
  grid.position.y = 0.01;
  scene.add(grid);

  // Gray art-mannequin: smooth plastic body, darker ball joints, faceless egg head
  var body = new THREE.MeshStandardMaterial({ color: 0x80868d, roughness: 0.55 });
  var joint = new THREE.MeshStandardMaterial({ color: 0x4d5258, roughness: 0.6 });

  function ell(r, sx, sy, sz, mat, x, y, z) {
    var m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat);
    m.scale.set(sx, sy, sz);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = true;
    return m;
  }
  function seg(rt, rb, len, mat, y) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, len, 16), mat);
    m.position.y = y;
    m.castShadow = true;
    return m;
  }

  var figure = new THREE.Group();
  scene.add(figure);
  figure.scale.setScalar(0.85);
  var hips = new THREE.Group(); hips.position.y = 1.0; figure.add(hips);
  hips.add(ell(0.28, 1.0, 0.55, 0.7, body, 0, 0.02, 0));
  var torso = new THREE.Group(); torso.position.y = 0.1; hips.add(torso);
  var ab = seg(0.2, 0.19, 0.42, body, 0.22); ab.scale.z = 0.75; torso.add(ab);
  var chest = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 0.567, 24), body);
  chest.scale.z = 0.75; chest.position.y = 0.634; chest.castShadow = true; torso.add(chest);
  var neck = new THREE.Group(); neck.position.y = 0.947; torso.add(neck);
  neck.add(ell(0.07, 1, 1, 1, joint, 0, 0, 0));
  neck.add(seg(0.065, 0.07, 0.16, body, 0.06));
  neck.add(ell(0.15, 0.85, 1.1, 0.95, body, 0, 0.24, 0));

  function makeArm(side) {
    var sh = new THREE.Group(); sh.position.set(side * 0.36, 0.8, 0); torso.add(sh);
    sh.add(ell(0.12, 0.85, 1.4, 0.95, joint, side * 0.02, -0.07, 0));
    sh.add(seg(0.075, 0.062, 0.4, body, -0.22));
    var el = new THREE.Group(); el.position.y = -0.42; sh.add(el);
    el.add(ell(0.062, 1, 1, 1, joint));
    el.add(seg(0.06, 0.045, 0.38, body, -0.2));
    el.add(ell(0.05, 0.8, 1.5, 0.5, body, 0, -0.46, 0));
    return { sh: sh, el: el };
  }
  function makeLeg(side) {
    var hp = new THREE.Group(); hp.position.set(side * 0.15, 0, 0); hips.add(hp);
    hp.add(ell(0.1, 1, 1, 1, joint));
    hp.add(seg(0.115, 0.075, 0.5, body, -0.27));
    var kn = new THREE.Group(); kn.position.y = -0.52; hp.add(kn);
    kn.add(ell(0.075, 1, 1, 1, joint));
    kn.add(seg(0.07, 0.05, 0.44, body, -0.24));
    kn.add(ell(0.06, 1, 0.7, 2.2, body, 0, -0.44, 0.07));
    return { hp: hp, kn: kn };
  }
  var aL = makeArm(-1), aR = makeArm(1), lL = makeLeg(-1), lR = makeLeg(1);
  var armL = aL.sh, armR = aR.sh, legL = lL.hp, legR = lR.hp;

  var anims = {
    Idle: function (t) {
      hips.position.y = 1.0 + Math.sin(t * 2) * 0.01;
      hips.rotation.y = 0;
      torso.rotation.set(Math.sin(t * 2) * 0.02, 0, 0);
      neck.rotation.set(0, Math.sin(t * 0.7) * 0.2, 0);
      armL.rotation.set(0, 0, -0.14 - Math.sin(t * 2) * 0.03);
      armR.rotation.set(0, 0, 0.14 + Math.sin(t * 2) * 0.03);
      legL.rotation.set(0, 0, 0);
      legR.rotation.set(0, 0, 0);
    },
    Wave: function (t) {
      anims.Idle(t);
      armR.rotation.set(0, 0, Math.PI * 0.85 + Math.sin(t * 8) * 0.2);
      neck.rotation.set(0, -0.3, 0.1);
    },
    Walk: function (t) {
      var s = Math.sin(t * 6);
      hips.position.y = 1.0 + Math.abs(Math.cos(t * 6)) * 0.06;
      hips.rotation.y = 0;
      legL.rotation.set(s * 0.7, 0, 0);
      legR.rotation.set(-s * 0.7, 0, 0);
      armL.rotation.set(-s * 0.6, 0, -0.12);
      armR.rotation.set(s * 0.6, 0, 0.12);
      torso.rotation.set(0, s * 0.1, 0);
      neck.rotation.set(0, -s * 0.1, 0);
    },
    Run: function (t) {
      var s = Math.sin(t * 10);
      hips.position.y = 1.0 + Math.abs(Math.cos(t * 10)) * 0.12;
      hips.rotation.y = 0;
      legL.rotation.set(s, 0, 0);
      legR.rotation.set(-s, 0, 0);
      armL.rotation.set(-s * 1.1, 0, -0.15);
      armR.rotation.set(s * 1.1, 0, 0.15);
      torso.rotation.set(0.25, s * 0.15, 0);
      neck.rotation.set(-0.2, 0, 0);
    },
    Jump: function (t) {
      var p = (t % 1.2) / 1.2, h = Math.sin(p * Math.PI);
      var crouch = (p < 0.15 || p > 0.85) ? 0.5 : 0;
      hips.position.y = 1.0 + h * 0.9;
      hips.rotation.y = 0;
      legL.rotation.set(-0.3 * h + crouch, 0, 0);
      legR.rotation.set(-0.3 * h + crouch, 0, 0);
      armL.rotation.set(0, 0, -0.3 - h * 2.2);
      armR.rotation.set(0, 0, 0.3 + h * 2.2);
      torso.rotation.set(0, 0, 0);
      neck.rotation.set(0, 0, 0);
    },
    Dance: function (t) {
      hips.position.y = 1.0 + Math.abs(Math.sin(t * 5)) * 0.1;
      hips.rotation.y = Math.sin(t * 2.5) * 0.5;
      torso.rotation.set(0, Math.sin(t * 5) * 0.3, Math.sin(t * 2.5) * 0.15);
      armL.rotation.set(0, 0, -Math.PI * 0.7 - Math.sin(t * 5) * 0.4);
      armR.rotation.set(0, 0, Math.PI * 0.7 + Math.sin(t * 5 + 1) * 0.4);
      legL.rotation.set(Math.sin(t * 5) * 0.4, 0, 0);
      legR.rotation.set(-Math.sin(t * 5) * 0.4, 0, 0);
      neck.rotation.set(0, 0, Math.sin(t * 5) * 0.15);
    }
  };

  // Elbow and knee flex driven from the main joint angles
  function flex(t) {
    var wave = current === 'Wave';
    aL.el.rotation.x = -0.2 - Math.abs(armL.rotation.x) * 0.7;
    aR.el.rotation.x = wave ? 0 : -0.2 - Math.abs(armR.rotation.x) * 0.7;
    aR.el.rotation.z = wave ? Math.sin(t * 8) * 0.5 : 0;
    lL.kn.rotation.x = Math.max(0, legL.rotation.x) * 1.2 + 0.04;
    lR.kn.rotation.x = Math.max(0, legR.rotation.x) * 1.2 + 0.04;
  }

  var current = 'Wave', buttons = {};
  var ui = document.getElementById('ui');
  Object.keys(anims).concat(['Free Walk']).forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n;
    b.onclick = function () { select(n); };
    ui.appendChild(b);
    buttons[n] = b;
  });
  function select(n) {
    current = n;
    for (var k in buttons) buttons[k].classList.toggle('active', k === n);
  }
  select('Wave');

  var keys = {};
  window.addEventListener('keydown', function (e) { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  var camAngle = 0, camDist = Math.sqrt(5 * 5 + 11 * 11), camElev = Math.atan2(11, 5);
  var camOffset = new THREE.Vector3(0, 11, 5);
  function setOffset() {
    var flat = camDist * Math.cos(camElev);
    camOffset.set(Math.sin(camAngle) * flat, camDist * Math.sin(camElev), Math.cos(camAngle) * flat);
  }
  var tilt = document.getElementById('tilt'), tiltDeg = document.getElementById('tiltdeg');
  tilt.addEventListener('input', function () {
    var d = parseFloat(tilt.value);
    camElev = d * Math.PI / 180;
    setOffset();
    tiltDeg.textContent = Math.round(d) + '°';
  });
  camera.position.copy(camOffset);
  var dial = document.getElementById('cam'), deg = document.getElementById('deg');
  dial.addEventListener('input', function () {
    var d = parseFloat(dial.value);
    camAngle = d * Math.PI / 180;
    setOffset();
    deg.textContent = Math.round(d) + '°';
  });

  function freeWalk(dt) {
    var dx = 0, dz = 0;
    if (keys['w'] || keys['arrowup']) dz -= 1;
    if (keys['s'] || keys['arrowdown']) dz += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (!dx && !dz) return false;
    var v = new THREE.Vector3(dx, 0, dz).normalize().multiplyScalar(3.5 * dt);
    v.applyAxisAngle(new THREE.Vector3(0, 1, 0), camAngle);
    figure.position.add(v);
    figure.position.clampLength(0, 28);
    figure.rotation.y = Math.atan2(v.x, v.z);
    return true;
  }

  var clock = new THREE.Clock();
  function loop() {
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    if (current === 'Free Walk') anims[freeWalk(dt) ? 'Walk' : 'Idle'](t);
    else anims[current](t);
    flex(t);
    var want = figure.position.clone().add(camOffset);
    camera.position.lerp(want, 1 - Math.pow(0.001, dt));
    camera.lookAt(figure.position.x, 1.0, figure.position.z);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
